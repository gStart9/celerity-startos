# Forwards the panel's machine-facing paths from port 3001 to the panel on
# 127.0.0.1:3000 and answers 404 for every other path.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log off;
    server_tokens off;
    # The access-log ingest accepts bodies up to 8 MiB.
    client_max_body_size 9m;

    upstream panel {
        server 127.0.0.1:3000;
        keepalive 16;
    }

    server {
        listen 3001;

        # Locations match the normalized path, and the request line goes upstream as sent.
        # Only plain paths pass, so the two cannot differ.
        if ($request_uri !~ "^/[A-Za-z0-9_./-]*(\?[^#]*)?$") {
            return 404;
        }
        if ($request_uri ~ "(^|/)\.\.?(/|\?|$)|//") {
            return 404;
        }

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # The panel trusts one proxy hop, so these must reach it unchanged from StartOS.
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host "";
        proxy_request_buffering off;

        # Hysteria nodes authenticate each client connection.
        location = /api/auth {
            proxy_pass http://panel;
        }

        # Client apps fetch subscriptions and subscription info.
        location ~ ^/api/(files|info)/[A-Za-z0-9_-]+$ {
            proxy_pass http://panel;
        }

        # CC Agents on Xray nodes ship access logs.
        location = /api/access-logs/ingest {
            proxy_pass http://panel;
        }

        # External diagnostic probes enroll, read their profile and ship results.
        location ~ ^/api/probe/(enroll|profile|ingest)$ {
            proxy_pass http://panel;
        }

        # FreeBSD nodes download the CC Agent binary.
        location ~ ^/agents/cc-agent-[a-z0-9-]+$ {
            proxy_pass http://panel;
        }

        location / {
            return 404;
        }
    }
}
